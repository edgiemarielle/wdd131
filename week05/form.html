<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - W05 Assignment: Product Review Form</title>
    <meta name="description"
        content="WDD 131 - Week 05 Assignment | For this week's assignment we are asked to create a Product Review Form Page to apply the design principles we learned.">
    <meta name="author" content="Edgie Marielle Ambao">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product-name">Product Name</label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product...</option>
                </select>

            <legend>Overall Rating</legend>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required>
                <label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required>
                <label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required>
                <label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required>
                <label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required>
                <label for="onestar"></label>
            </div>

            <label for="date">Date of Installation</label>
            <input type="date" id="date" name="date" required>
            
            <p>Which features did you find useful in the product? (Check all that apply)</p>
                <div class="checkbox">
                    <input type="checkbox" id="durability" name="durability" value="durability">
                    <label for="durability">Durability</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="ease" name="ease" value="ease">
                    <label for="ease">Ease of Use</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="performance" name="performance" value="performance">
                    <label for="performance">Performance</label>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="design" name="design" value="design">
                    <label for="design">Design</label>
                </div>
                
            <label for="review">Written Review (Optional)</label> 
            <textarea id="review" name="review"></textarea>

            <label for="name">Your Name (Optional)</label>
            <input type="text" id="name" name="name" autocomplete="name">

            <input type="submit" value="Post Review"> 
        </form>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> 💌Edgie Marielle Ambao💌 Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
